<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="login-box">

<h1>Create Account</h1>

<form action="/register" method="POST">

<input
type="text"
name="full_name"
placeholder="Full Name"
required>

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Register

</button>

</form>

<br>

<a href="/">Back to Login</a>

</div>

</body>
</html>
