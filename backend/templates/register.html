{% extends "guest_base.html" %}

{% block title %}
TalentIQ AI | Register
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            📝
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join TalentIQ AI and begin your AI-powered career journey.
        </p>

        <form action="/register" method="POST">

            <div class="input-group">

                <label>👤 Full Name</label>

                <input
                    type="text"
                    name="full_name"
                    placeholder="Enter your full name"
                    required>

            </div>

            <div class="input-group">

                <label>🆔 Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required>

            </div>

            <div class="input-group">

                <label>📧 Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label>🔒 Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a strong password"
                    required>

            </div>

            <button class="login-btn" type="submit">

                🚀 Create Account

            </button>

        </form>

        <div class="footer">

            <p>

                Already have an account?

                <a href="/">Login Here</a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
