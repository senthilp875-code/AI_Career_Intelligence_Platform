{% extends "guest_base.html" %}

{% block title %}
TalentIQ AI | Login
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🤖
        </div>

        <h1>TalentIQ AI</h1>

        <p class="subtitle">
            Smart Resume Analysis • AI Career Prediction • ATS Optimization
        </p>

        <form action="/login" method="POST">

            <div class="input-group">

                <label>👤 Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>

            </div>

            <div class="input-group">

                <label>🔒 Password</label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>

            <div class="options">

                <label class="remember">

                    <input type="checkbox">

                    Remember Me

                </label>

                <!-- Forgot Password -->
                <a href="/forgot-password" class="forgot">

                    Forgot Password?

                </a>

            </div>

            <button class="login-btn" type="submit">

                🚀 Login to Dashboard

            </button>

            <a href="/admin/login" class="admin-login-btn">

                🛡️ Admin Login

            </a>

        </form>

        <div class="footer">

            <p>

                New to TalentIQ AI?

                <a href="/register">

                    Create Account

                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}

{% block js %}

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

{% endblock %}
