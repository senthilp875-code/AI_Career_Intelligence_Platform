<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | TalentIQ AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-login-body">
<div class="admin-login-card">
    <div class="admin-login-icon">
        <i class="fas fa-shield-halved"></i>
    </div>
    <h1>TalentIQ AI</h1>
    <p>Administrative Control Center</p>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="admin-flash admin-flash-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin.login') }}">
        <div class="mb-3">
            <label>Administrator Username</label>
            <input type="text" name="username" placeholder="e.g. admin" required autocomplete="username">
        </div>
        <div class="mb-3">
            <label>Secure Password</label>
            <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit">Sign In to Dashboard</button>
    </form>
    
    <a class="admin-back-link" href="/">
        <i class="fas fa-arrow-left me-2"></i> Back to User Login
    </a>
</div>
</body>

</html>
