{% macro render_pagination(pager, q='') %}
{% if pager.total_pages > 1 %}
<nav class="admin-pagination" aria-label="Pagination">
    {% if pager.has_prev %}
    <a href="?page={{ pager.page - 1 }}{% if q %}&q={{ q|urlencode }}{% endif %}">Previous</a>
    {% endif %}
    <span>Page {{ pager.page }} of {{ pager.total_pages }}</span>
    {% if pager.has_next %}
    <a href="?page={{ pager.page + 1 }}{% if q %}&q={{ q|urlencode }}{% endif %}">Next</a>
    {% endif %}
</nav>
{% endif %}
{% endmacro %}
